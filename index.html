/* =================================
   ESCAPAR HTML
================================= */

function escapar(texto){

    return String(texto)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");

}


/* =================================
   MENSAGEM DO USUÁRIO
================================= */

function usuario(texto){

    var div =
    document.createElement("div");

    div.className="message user";

    div.innerHTML=
    '<div class="name">Você</div>'+
    '<div>'+escapar(texto)+'</div>';

    chatContent.appendChild(div);

}


/* =================================
   MENSAGEM DA IA
================================= */

function ia(texto){

    var div =
    document.createElement("div");

    div.className="message ai";

    var nome =
    document.createElement("div");

    nome.className="name";

    nome.innerText="🤖 ScriptAI";

    div.appendChild(nome);


    var partes =
    texto.split("```");


    for(
        var i=0;
        i<partes.length;
        i++
    ){

        if(i % 2 === 0){

            var p =
            document.createElement("div");

            p.innerHTML =
            escapar(partes[i])
            .replace(/\n/g,"<br>");

            div.appendChild(p);

        }else{

            var box =
            document.createElement("div");

            box.className="codebox";


            var head =
            document.createElement("div");

            head.className="codehead";


            var label =
            document.createElement("span");

            label.innerText="Lua / Luau";


            var copy =
            document.createElement("button");

            copy.className="copy";

            copy.innerText="📋 Copiar";


            var pre =
            document.createElement("pre");

            pre.innerText=partes[i];


            copy.onclick =
            function(){

                var codigo =
                this.parentElement
                .nextElementSibling
                .innerText;

                navigator.clipboard
                .writeText(codigo);

                this.innerText="✅ Copiado!";

                var botao=this;

                setTimeout(
                function(){

                    botao.innerText="📋 Copiar";

                },1500);

            };


            head.appendChild(label);

            head.appendChild(copy);

            box.appendChild(head);

            box.appendChild(pre);

            div.appendChild(box);

        }

    }


    chatContent.appendChild(div);

    chat.scrollTop =
    chat.scrollHeight;

}
