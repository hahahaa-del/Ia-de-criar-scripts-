.box{
    max-width:900px;

    gap:8px;
    background:#151a23;
    border:1px solid #343b49;

    padding:7px;
}

textarea{
    flex:1;
    min-width:0;
    height:45px;

<body>

<div class="app">

<aside class="sidebar">

<div class="logo">
⚡ Script<span>AI</span>
</div>

<button class="new" id="newChat">
＋ Novo chat

<button class="tool" data-prompt="Crie um script de sistema de dinheiro para Roblox com leaderstats e moedas.">

</button>

</button>

<button class="tool" data-prompt="Crie um sistema de empregos para Roblox com salários.">

</button>

<button class="tool" data-prompt="Crie um sistema de casas compráveis para Roblox.">
🏠 Sistema de casas
</button>

<button class="tool" data-prompt="Crie um sistema de carros para Roblox.">

</aside>


<main class="main">

● Online
</span>

</header>


<section class="chat" id="chat">

<div class="welcome">

Peça um script ou sistema para Roblox.

<p>

</div>

</div>

<footer class="composer">

<div class="box">

id="input"

<button
class="send"
id="sendButton"
type="button"
>
GERAR

</div>

💰 Dinheiro
</button>

</button>

<script>

const input =
document.getElementById("input");

const sendButton =
document.getElementById("sendButton");

const chatContent =
document.getElementById("chatContent");


/* ==========================
   ADICIONAR MENSAGEM
========================== */

function addMessage(text,type){

    const message =
    document.createElement("div");

    message.className =
    "message " + type;


    const name =
    document.createElement("div");

    name.className="name";

    name.textContent =
    type === "user"
    ? "Você"
    : "🤖 ScriptAI";


    message.appendChild(name);


    const content =
    document.createElement("div");

    content.innerHTML =
    formatText(text);


    message.appendChild(content);

    chatContent.appendChild(message);


    document.getElementById("chat")
    .scrollTo({
        top:document.getElementById("chat")
        .scrollHeight,
        behavior:"smooth"
    });

}


/* ==========================
   FORMATAR TEXTO
========================== */

function formatText(text){

    let safe =
    String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");


    const parts =
    safe.split("```");


    let html="";


    parts.forEach(
    (part,index)=>{

        if(index % 2 === 0){

            html +=
            part.replace(
                /\n/g,
                "<br>"
            );

        }else{

            html += `

            <div class="code">

                <div class="codeTop">

                    <span>Lua / Luau</span>

                    <button
                    class="copy"
                    onclick="copiarCodigo(this)"
                    >
                    📋 Copiar
                    </button>

                </div>

                <pre>${part}</pre>

            </div>

            `;

        }

    });


    return html;

}


/* ==========================
   COPIAR CÓDIGO
========================== */

function copiarCodigo(button){

    const codigo =
    button
    .parentElement
    .nextElementSibling
    .innerText;


    navigator.clipboard
    .writeText(codigo)
    .then(()=>{

        button.innerText =
        "✅ Copiado!";

        setTimeout(
        ()=>{

            button.innerText =
            "📋 Copiar";

        },
        1500
        );

    });

}


/* ==========================
   DETECTAR PEDIDO
========================== */

function querScript(text){

    const t =
    text.toLowerCase();


    const palavras=[

        "cria um script",
        "crie um script",
        "faz um script",
        "faca um script",

        "gera um script",
        "gere um script",

        "quero um script",
        "preciso de um script",

        "cria um sistema",
        "crie um sistema",
        "faz um sistema",
        "faca um sistema",

        "gera um sistema",
        "gere um sistema",

        "quero um sistema",
        "preciso de um sistema",

        "criar um sistema",
        "criar um script",

        "script para",
        "script de",

        "codigo para",
        "código para",

        "sistema de",
        "sistema para"

    ];


    return palavras.some(
        palavra =>
        t.includes(palavra)
    );

}


/* ==========================
   GERAR CÓDIGO
========================== */

function gerarCodigo(pedido){

    const t =
    pedido.toLowerCase();


    if(
        t.includes("dinheiro") ||
        t.includes("moeda")
    ){

        return `Aqui está um sistema básico de dinheiro para Roblox:

```lua

Players.PlayerAdded:Connect(function(player)

    local leaderstats = Instance.new("Folder")
    leaderstats.Name = "leaderstats"
    leaderstats.Parent = player

    local dinheiro = Instance.new("IntValue")
    dinheiro.Name = "Dinheiro"
    dinheiro.Value = 500
    dinheiro.Parent = leaderstats

end)

Coloque esse Script em ServerScriptService.`;

}


if(t.includes("loja")){

    return `Sistema básico de loja:

local ReplicatedStorage =
    game:GetService("ReplicatedStorage")

local comprar =
    Instance.new("RemoteEvent")

comprar.Name = "ComprarItem"
comprar.Parent = ReplicatedStorage

comprar.OnServerEvent:Connect(function(player, preco)

    local stats =
        player:FindFirstChild("leaderstats")

    if not stats then return end

    local dinheiro =
        stats:FindFirstChild("Dinheiro")

    if not dinheiro then return end

    if dinheiro.Value >= preco then

        dinheiro.Value -= preco

        print(player.Name .. " comprou o item!")

    end

end)
````;

    }


    if(t.includes("emprego")){

        return `Sistema de empregos:

```lua
local empregos = {
    Policial = 250,
    Medico = 220,
    Motorista = 180,
    Entregador = 150
}

local function escolherEmprego(player,nome)

    local salario =
        empregos[nome]

    if not salario then
        return
    end

    player:SetAttribute(
        "Emprego",
        nome
    )

    player:SetAttribute(
        "Salario",
        salario
    )

end

_G.EscolherEmprego =
    escolherEmprego
````;

    }


    if(t.includes("casa")){

        return `Sistema de casas:

```lua
local casas = {}

local function comprarCasa(
    player,
    nome,
    preco
)

    if casas[nome] then
        return false
    end

    local stats =
        player:FindFirstChild("leaderstats")

    if not stats then
        return false
    end

    local dinheiro =
        stats:FindFirstChild("Dinheiro")

    if not dinheiro then
        return false
    end

    if dinheiro.Value < preco then
        return false
    end

    dinheiro.Value -= preco

    casas[nome] =
        player.UserId

    return true

end

_G.ComprarCasa =
    comprarCasa
````;

    }


    if(t.includes("carro")){

        return `Sistema básico de veículos:

```lua
local ReplicatedStorage =
    game:GetService("ReplicatedStorage")

local spawnCar =
    Instance.new("RemoteEvent")

spawnCar.Name =
    "SpawnCar"

spawnCar.Parent =
    ReplicatedStorage

spawnCar.OnServerEvent:Connect(
function(player,carro)

    if not carro then
        return
    end

    local novoCarro =
        carro:Clone()

    novoCarro.Parent =
        workspace

    if player.Character then

        novoCarro:PivotTo(
            player.Character:GetPivot()
            * CFrame.new(0,0,-10)
        )

    end

end)
````;

    }


    if(t.includes("npc")){

        return `Sistema de NPC:

```lua
local PathfindingService =
    game:GetService("PathfindingService")

local function andarNPC(npc,destino)

    local humanoid =
        npc:FindFirstChildOfClass("Humanoid")

    local root =
        npc:FindFirstChild("HumanoidRootPart")

    if not humanoid or not root then
        return
    end

    local path =
        PathfindingService:CreatePath()

        root.Position,

    )

       Enum.PathStatus.Success then

        ipairs(path:GetWaypoints()) do

            humanoid:MoveTo(
                waypoint.Position
            )

            humanoid.MoveToFinished:Wait()

        end

    end

end

_G.AndarNPC =
    andarNPC
````;

    }


    if(
        t.includes("celular") ||
        t.includes("telefone")
    ){

        return `Sistema de celular GUI:

```lua
local Players =
    game:GetService("Players")

local player =
    Players.LocalPlayer

local gui =
    Instance.new("ScreenGui")

gui.Name =
    "CelularGUI"

gui.Parent =
    player:WaitForChild("PlayerGui")

local frame =
    Instance.new("Frame")

frame.Size =
    UDim2.fromOffset(280,500)

frame.Position =
    UDim2.new(0.5,-140,0.5,-250)

frame.Parent =
    gui

local titulo =
    Instance.new("TextLabel")

titulo.Size =
    UDim2.new(1,0,0,50)

titulo.Text =
    "📱 CELULAR"

titulo.Parent =
    frame
````;

    }


    if(
        t.includes("policia") ||
        t.includes("polícia") ||
        t.includes("prisao") ||
        t.includes("prisão")
    ){

        return `Sistema de polícia:

```lua
local function colocarProcurado(
    player,
    nivel
)

    player:SetAttribute(
        "Procurado",
        nivel
    )

end

local function prender(
    player,
    tempo
)

    player:SetAttribute(
        "Preso",
        true
    )

    task.delay(
        tempo,
        function()

            if player then

                player:SetAttribute(
                    "Preso",
                    false
                )

            end

        end
    )

end

_G.ColocarProcurado =
    colocarProcurado

_G.Prender =
    prender
````;

    }


    return `Entendi o sistema que você pediu.

Para gerar um sistema específico, diga exatamente o que ele deve fazer.

Por exemplo:

"Crie um sistema de dinheiro para Roblox com DataStore, GUI e salário."`;

}


/* ==========================
   RESPOSTA NORMAL
========================== */

function respostaNormal(text){

    const t =
    text.toLowerCase().trim();


    if(
        t === "oi" ||
        t === "olá" ||
        t === "ola" ||
        t === "eai" ||
        t === "e aí" ||
        t === "opa"
    ){

        return `Olá! 👋

Sou a ScriptAI.

Posso conversar normalmente ou criar scripts para Roblox.

Quando quiser código, diga:
"Crie um sistema de dinheiro para Roblox."`;

    }


    if(
        t.includes("quem é você") ||
        t.includes("quem e voce")
    ){

        return `Sou a ScriptAI 🤖

Meu objetivo é ajudar você a criar scripts e sistemas para Roblox.`;

    }


    return `Entendi! 👍

Se quiser que eu crie um código, diga algo como:

"Crie um script de sistema de dinheiro para Roblox."`;

}


/* ==========================
   FUNÇÃO ENVIAR
========================== */

function enviar(){

    const texto =
    input.value.trim();


    if(texto === ""){
        return;
    }


    input.value = "";


    addMessage(
        texto,
        "user"
    );


    setTimeout(
    function(){

        let resposta;


        if(
            querScript(texto)
        ){

            resposta =
            gerarCodigo(texto);

        }else{

            resposta =
            respostaNormal(texto);

        }


        addMessage(
            resposta,
            "ai"
        );

    },
    400
    );

}


/* ==========================
   BOTÃO GERAR
========================== */

sendButton.onclick =
function(){

    enviar();

};


/* ==========================
   ENTER
========================== */

input.onkeydown =
function(event){

    if(
        event.key === "Enter" &&
        !event.shiftKey
    ){

        event.preventDefault();

        enviar();

    }

};


/* ==========================
   BOTÕES DE SISTEMA
========================== */

document
.querySelectorAll(
    "[data-prompt]"
)
.forEach(
function(button){

    button.onclick =
    function(){

        input.value =
        button.dataset.prompt;

        input.focus();

    };

});


/* ==========================
   NOVO CHAT
========================== */

document
.getElementById("newChat")
.onclick =
function(){

    chatContent.innerHTML = `

    <div class="welcome">

        <h1>⚡ ScriptAI</h1>

        <p>
        Peça um script ou sistema para Roblox.
        </p>

    </div>

    `;

    input.value="";

    input.focus();

};


/* ==========================
   LIMPAR
========================== */

document
.getElementById("clearButton")
.onclick =
function(){

    chatContent.innerHTML="";

    input.value="";

    input.focus();

};

</script>
