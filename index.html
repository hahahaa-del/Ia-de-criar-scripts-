<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>ScriptAI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    background:#080a0f;
    color:#f5f5f7;
    font-family:Arial,Helvetica,sans-serif;
    height:100vh;
    overflow:hidden;
}

button{font-family:inherit}

.app{

    width:100%;
    height:100vh;
}

.sidebar{

.logo{

}

.logo span{color:#825cff}

.new-chat{

.section-title{

.tools{

.tool{

.header-title{

.status{

.chat-inner{

.welcome-icon{

.welcome p{

}

.suggestions{
    display:flex;
    flex-wrap:wrap;

.suggestion{

    color:#e4e7ec;

    border-radius:9px;

}

.suggestion:hover{background:#222835}

.message{

    border-radius:13px;

.user-message{

}

.ai-message{

    border:1px solid #252b37;
}

.message-name{
    font-size:12px;

    color:#aeb6c5;
}

.ai-message .message-name{color:#8f73ff}

.code-container{

    background:#07090d;
    border:1px solid #303744;
    border-radius:11px;

.code-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:9px 11px;
    border-bottom:1px solid #252a33;
    color:#8992a3;
    font-size:11px;
}

.copy-button{
    border:0;
    background:#1a1f29;
    color:#dfe3eb;
    padding:6px 9px;

}

pre{

.composer{

.composer-inner{

.input-box{
    display:flex;

    gap:8px;
    background:#151922;
    border:1px solid #303642;
    border-radius:14px;

}

.input-box:focus-within{border-color:#825cff}

textarea{

    min-width:0;
    min-height:45px;
    max-height:160px;

    background:transparent;

    padding:10px;
    font-size:14px;

.send{

    border:0;
    border-radius:10px;

.bottom-tools{

    color:#cdd2dc;

    font-size:11px;

</style>
</head>

<script>

const CHAVE="SCRIPT_AI_CHATS_V2";

let chats=[];

try{
    chats=JSON.parse(localStorage.getItem(CHAVE)||"[]");
}catch{
    chats=[];
}

let conversaAtual=[];

function salvar(){

    localStorage.setItem(
        CHAVE,
        JSON.stringify(chats)
    );

}

function modelo(texto){

    document.getElementById("input").value=texto;
    document.getElementById("input").focus();

}

function novoChat(){

    if(conversaAtual.length){

        chats.push({
            mensagens:[...conversaAtual],
            data:new Date().toLocaleString("pt-BR")
        });

        salvar();

    }

    conversaAtual=[];

    document.getElementById("chat").innerHTML="";

    mostrarWelcome();

    atualizarHistorico();

}

function limparChat(){

    conversaAtual=[];

    document.getElementById("chat").innerHTML="";

    mostrarWelcome();

}

function mostrarWelcome(){

    document.getElementById("chat").innerHTML=`

    <div class="welcome">

        <div class="welcome-icon">⚡</div>

        <h1>O que você quer criar?</h1>

        <p>
        Descreva seu sistema Roblox com todos os detalhes.
        </p>

        <div class="suggestions">

            <button class="suggestion"
            onclick="modelo('Crie uma cidade RP completa com dinheiro, empregos, lojas, casas, carros, NPCs, celular e polícia.')">
            🏙️ Cidade RP
            </button>

            <button class="suggestion"
            onclick="modelo('Crie um sistema completo de loja com moedas e salvamento.')">
            🛒 Loja
            </button>

            <button class="suggestion"
            onclick="modelo('Crie um sistema completo de empregos com salários.')">
            💼 Empregos
            </button>

            <button class="suggestion"
            onclick="modelo('Crie um sistema completo de casas compráveis.')">
            🏠 Casas
            </button>

        </div>

    </div>

    `;

}

function escapeHTML(text){

    return text.replace(/[&<>"']/g,function(m){

        return {
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
        }[m];

    });

}

function mostrarUsuario(texto){

    const div=document.createElement("div");

    div.className="message user-message";

    div.innerHTML=
        '<div class="message-name">Você</div>'+
        escapeHTML(texto);

    document.getElementById("chat").appendChild(div);

}

function mostrarIA(texto){

    const div=document.createElement("div");

    div.className="message ai-message";

    const nome=document.createElement("div");

    nome.className="message-name";

    nome.textContent="🤖 ScriptAI";

    div.appendChild(nome);

    const partes=texto.split(/```(?:lua|luau)?/i);

    let codigoEncontrado=false;

    for(let i=0;i<partes.length;i++){

        if(i%2===0){

            const p=document.createElement("div");

            p.textContent=partes[i];

            div.appendChild(p);

        }else{

            codigoEncontrado=true;

            const container=document.createElement("div");

            container.className="code-container";

            const topo=document.createElement("div");

            topo.className="code-top";

            const linguagem=document.createElement("span");

            linguagem.textContent="Lua / Luau";

            const copiar=document.createElement("button");

            copiar.className="copy-button";

            copiar.textContent="📋 Copiar";

            copiar.onclick=async function(){

                const codigo=partes[i];

                try{

                    await navigator.clipboard.writeText(
                        codigo.trim()
                    );

                    copiar.textContent="✅ Copiado!";

                    setTimeout(
                        ()=>copiar.textContent="📋 Copiar",
                        1500
                    );

                }catch{

                    copiar.textContent="❌ Erro";

                }

            };

            topo.appendChild(linguagem);
            topo.appendChild(copiar);

            const pre=document.createElement("pre");

            pre.textContent=partes[i];

            container.appendChild(topo);
            container.appendChild(pre);

            div.appendChild(container);

        }

    }

    if(!codigoEncontrado){

        const p=document.createElement("p");

        p.textContent=texto;

        div.appendChild(p);

    }

    document.getElementById("chat").appendChild(div);

}

function gerarProjeto(pedido){

    const p=pedido.toLowerCase();

    let partes=[];

    if(
        p.includes("cidade") ||
        p.includes("rp")
    ){

        partes.push({

            nome:"ServerScriptService/CityServer.server.lua",

            codigo:`-- ScriptAI - Sistema base de Cidade RP

local Players = game:GetService("Players")

local dinheiroStore =
    DataStoreService:GetDataStore("ScriptAI_Dinheiro_V1")

Players.PlayerAdded:Connect(function(player)

    local leaderstats =
        Instance.new("Folder")

    leaderstats.Name="leaderstats"
    leaderstats.Parent=player

    local dinheiro =
        Instance.new("IntValue")

    dinheiro.Name="Dinheiro"
    dinheiro.Value=500
    dinheiro.Parent=leaderstats

    local sucesso,dados=
        pcall(function()

            return dinheiroStore:GetAsync(
                player.UserId
            )

        end)

    if sucesso and dados then
        dinheiro.Value=dados
    end

end)

Players.PlayerRemoving:Connect(function(player)

    local stats=
        player:FindFirstChild("leaderstats")

    if not stats then return end

    local dinheiro=
        stats:FindFirstChild("Dinheiro")

    if not dinheiro then return end

    pcall(function()

        dinheiroStore:SetAsync(
            player.UserId,
            dinheiro.Value
        )

    end)

end)`
        });

    }

    if(
        p.includes("dinheiro") ||

    ){

    if not money then

        money=Instance.new("IntValue")
        money.Name="Dinheiro"
        money.Value=500
        money.Parent=stats

    end

end)

local function adicionarDinheiro(
    player,
    quantidade
)

    local stats=
        player:FindFirstChild("leaderstats")

    if not stats then return end

    local money=
        stats:FindFirstChild("Dinheiro")

    if money then
        money.Value += quantidade
    end

end

_G.AdicionarDinheiro=adicionarDinheiro`
        });

    }

    if(p.includes("loja")){

        if not produto then return end

        local stats=

        if not stats then return end

        local dinheiro=

        if dinheiro.Value >= produto.preco then

            dinheiro.Value -= produto.preco

            print(

            )

        end

    end
)`
        });

    }

    if(p.includes("emprego")){

        partes.push({

            nome:"ServerScriptService/Jobs.server.lua",

            codigo:`-- Sistema de empregos

local ReplicatedStorage=
    game:GetService("ReplicatedStorage")

local escolher=
    Instance.new("RemoteEvent")

escolher.Name="EscolherEmprego"
escolher.Parent=ReplicatedStorage

    function(player,emprego)

        local salario=

        if not salario then return end

        player:SetAttribute(

        )

    end
)`
        });

    }

    if(p.includes("casa")){

        partes.push({

            nome:"ServerScriptService/Houses.server.lua",

            codigo:`-- Sistema de propriedades

    player,

)

    }

    if(p.includes("carro") || p.includes("veículo")){

        partes.push({

            nome:"ServerScriptService/VehicleServer.server.lua",

            codigo:`-- Sistema base de veículos

    game:GetService("ReplicatedStorage")

    Instance.new("RemoteEvent")

    function(player,modelo)

        if typeof(modelo)~="Instance" then
            return
        end

        local clone=

        clone.Parent=

        if player.Character then

)`
        });

    }

    if(p.includes("npc")){

        partes.push({

            nome:"ServerScriptService/NPCSystem.server.lua",

            codigo:`-- Sistema base de NPC

local PathfindingService=
    game:GetService("PathfindingService")

local function fazerNPCAndar(

)

            "Humanoid"
        )

        npc:FindFirstChild(
            "HumanoidRootPart"
        )
