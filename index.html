/* ================================
   ESCAPAR TEXTO
================================ */

function escapeHTML(text){

    return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ================================
   ADICIONAR MENSAGEM
================================ */

function addUser(text){

    var div =
    document.createElement("div");

    div.className="message user";

    div.innerHTML =
    '<div class="messageName">Você</div>' +
    '<div>' +
    escapeHTML(text) +
    '</div>';

    chatContent.appendChild(div);

}


function addAI(text){

    var div =
    document.createElement("div");

    div.className="message ai";


    var name =
    document.createElement("div");

    name.className="messageName";

    name.innerText="🤖 ScriptAI";


    div.appendChild(name);


    var parts =
    text.split("```");


    for(
        var i=0;
        i<parts.length;
        i++
    ){

        if(i % 2 === 0){

            var normal =
            document.createElement("div");

            normal.innerHTML =
            escapeHTML(parts[i])
            .replace(/\n/g,"<br>");

            div.appendChild(normal);

        }else{

            var box =
            document.createElement("div");

            box.className="codeBox";


            var header =
            document.createElement("div");

            header.className="codeHeader";


            var label =
            document.createElement("span");

            label.innerText="Lua / Luau";


            var copy =
            document.createElement("button");

            copy.className="copyButton";

            copy.innerText="📋 Copiar";


            var code =
            document.createElement("pre");

            code.innerText=parts[i];


            copy.onclick =
            function(){

                var codeText =
                this.parentElement
                .nextElementSibling
                .innerText;


                if(
                    navigator.clipboard
                ){

                    navigator.clipboard
                    .writeText(codeText)
                    .then(
                    function(){

                        copy.innerText=
                        "✅ Copiado!";

                        setTimeout(
                        function(){

                            copy.innerText=
                            "📋 Copiar";

                        },
                        1500
                        );

                    });

                }

            };


            header.appendChild(label);

            header.appendChild(copy);

            box.appendChild(header);

            box.appendChild(code);

            div.appendChild(box);

        }

    }


    chatContent.appendChild(div);

}


/* ================================
   DETECTAR PEDIDO DE SCRIPT
================================ */

function isScriptRequest(text){

    var t =
    text.toLowerCase();


    var phrases=[

        "cria um script",
        "crie um script",
        "faca um script",
        "faça um script",

        "faz um script",
        "gera um script",
        "gere um script",

        "quero um script",
        "preciso de um script",

        "cria um sistema",
        "crie um sistema",
        "faz um sistema",
        "faca um sistema",
        "faça um sistema",

        "gera um sistema",
        "gere um sistema",

        "quero um sistema",
        "preciso de um sistema",

        "criar um script",
        "criar um sistema",

        "script para",
        "script de",

        "sistema para",
        "sistema de",

        "codigo para",
        "código para"

    ];


    for(
        var i=0;
        i<phrases.length;
        i++
    ){

        if(
            t.indexOf(
                phrases[i]
            ) !== -1
        ){

            return true;

        }

    }


    return false;

}

function AdicionarXP(
    player,
    quantidade
)

    local xp =
        player:GetAttribute("XP")
        or 0

    local nivel =
        player:GetAttribute("Nivel")
        or 1

    xp += quantidade

    local necessario =
        nivel * 100

    while xp >= necessario do

        xp -= necessario

        nivel += 1

        necessario =
            nivel * 100

    end
