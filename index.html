<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{

    color:#f5f5f7;

    overflow:hidden;
}

button{font-family:inherit}

.app{

}

.sidebar{

.logo{

}

.logo span{color:#825cff}

.new-chat{

    border:0;

.new-chat:hover{background:#7048f0}

.section-title{

    font-weight:bold;

.tools{

}

.tool{

    cursor:pointer;

}

.tool:hover{background:#222835}

.history-area{

    min-height:0;
    overflow-y:auto;
    margin-top:8px;
}

.history-item{
    width:100%;

    background:#141821;

    padding:9px;

}

.main{

.header{

}

.header-title{

    font-size:15px;
}

.status{
    font-size:12px;

}

.chat{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:30px 20px;
}

.chat-inner{
    max-width:900px;
    margin:auto;

.welcome{
    text-align:center;
    padding-top:9vh;
}

.welcome-icon{
    width:65px;
    height:65px;
    border-radius:18px;
    background:#825cff;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 18px;
    font-size:30px;
    box-shadow:0 10px 40px rgba(130,92,255,.25);
}

.welcome h1{
    font-size:38px;
    margin-bottom:10px;
}

.welcome p{
    color:#8e96a6;
    line-height:1.5;
}

.suggestions{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin-top:25px;
}

.suggestion{
    border:1px solid #2b3140;
    background:#141821;
    color:#e4e7ec;
    padding:10px 13px;
    border-radius:9px;
    cursor:pointer;
}

.suggestion:hover{background:#222835}

.message{
    margin-bottom:18px;
    padding:15px;
    border-radius:13px;
    line-height:1.5;
    word-wrap:break-word;
}

.user-message{
    background:#191e28;
    border:1px solid #252b37;
}

.ai-message{
    background:#10141b;
    border:1px solid #252b37;
}

.message-name{
    font-size:12px;
    font-weight:bold;
    margin-bottom:7px;
    color:#aeb6c5;
}

.user-message .message-name{color:#bcaeff}
.ai-message .message-name{color:#8f73ff}

.code-container{
    margin-top:12px;
    background:#07090d;
    border:1px solid #303744;
    border-radius:11px;
    overflow:hidden;
}

.code-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:9px 11px;
    border-bottom:1px solid #252a33;
    color:#8992a3;
    font-size:11px;
}

.copy-button{
    border:0;
    background:#1a1f29;
    color:#dfe3eb;
    padding:6px 9px;
    border-radius:7px;
    cursor:pointer;
}

pre{
    margin:0;
    padding:15px;
    overflow-x:auto;
    color:#e7e9ee;
    font-family:Consolas,monospace;
    font-size:13px;
    line-height:1.55;
}

.composer{
    flex-shrink:0;
    border-top:1px solid #252a35;
    background:#0b0e14;
    padding:13px 20px 17px;
}

.composer-inner{
    max-width:900px;
    margin:auto;
}

.input-box{
    display:flex;
    align-items:flex-end;
    gap:8px;
    background:#151922;
    border:1px solid #303642;
    border-radius:14px;
    padding:8px;
}

.input-box:focus-within{border-color:#825cff}

textarea{
    flex:1;
    min-width:0;
    min-height:45px;
    max-height:160px;
    resize:none;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    padding:10px;
    font-size:14px;
}

.send{
    flex-shrink:0;
    border:0;
    border-radius:10px;
    padding:11px 16px;
    background:#825cff;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.bottom-tools{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:8px;
}

.bottom-tools button{
    border:1px solid #292f3b;
    background:#151a23;
    color:#cdd2dc;
    padding:7px 10px;
    border-radius:8px;
    font-size:11px;
    cursor:pointer;
}

@media(max-width:750px){
    .sidebar{display:none}
    .header{padding:0 14px}
    .chat{padding:18px 12px}
    .composer{padding:10px 12px 14px}
    .welcome{padding-top:6vh}
    .welcome h1{font-size:29px}
    .message{padding:13px}
    .send{padding:10px 13px}
}
</style>
</head>

<body>

<div class="section-title">SISTEMAS</div>

<button class="tool" onclick="modelo('Crie um sistema completo de dinheiro e moedas para meu jogo Roblox, com leaderstats, GUI, coleta de moedas e salvamento DataStore.')">💰 Dinheiro</button>

<button class="tool" onclick="modelo('Crie um sistema completo de loja para Roblox com GUI, produtos, compra, venda, moedas e salvamento.')">🛒 Loja</button>

</aside>

<main class="main">

</div>

Gerar

<script>

const CHAVE="SCRIPT_AI_CHATS_V2";

let chats=[];

try{
    chats=JSON.parse(
        localStorage.getItem(CHAVE)||"[]"
    );
}catch{
    chats=[];
}

let conversaAtual=[];

function salvar(){
    localStorage.setItem(
        CHAVE,
        JSON.stringify(chats)
    );
}

function modelo(texto){
    document.getElementById("input").value=texto;
    document.getElementById("input").focus();
}

function novoChat(){

    if(conversaAtual.length){

        chats.push({
            titulo:
                conversaAtual[0]?.texto ||
                "Novo chat",
            mensagens:[...conversaAtual],
            data:new Date().toLocaleString("pt-BR")
        });

        salvar();
    }

    conversaAtual=[];

    document.getElementById("chat").innerHTML="";

    mostrarWelcome();

    atualizarHistorico();
}

function limparChat(){

    conversaAtual=[];

    document.getElementById("chat").innerHTML="";

    mostrarWelcome();
}

function mostrarWelcome(){

    document.getElementById("chat").innerHTML=`

    <div class="welcome">

        <div class="welcome-icon">⚡</div>

        <h1>O que você quer criar?</h1>

        <p>
        Descreva seu sistema Roblox com todos os detalhes.
        </p>

        <div class="suggestions">

            <button class="suggestion"
            onclick="modelo('Crie uma cidade RP completa com dinheiro, empregos, lojas, casas, carros, NPCs, celular e polícia.')">
            🏙️ Cidade RP
            </button>

            <button class="suggestion"
            onclick="modelo('Crie um sistema completo de loja com moedas e salvamento.')">
            🛒 Loja
            </button>

            <button class="suggestion"
            onclick="modelo('Crie um sistema completo de empregos com salários.')">
            💼 Empregos
            </button>

            <button class="suggestion"
            onclick="modelo('Crie um sistema completo de casas compráveis.')">
            🏠 Casas
            </button>

        </div>

    </div>

    `;
}

function escapeHTML(text){

    return text.replace(
        /[&<>"']/g,
        function(m){

            return {
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"
            }[m];

        }
    );

}

function mostrarUsuario(texto){

    const div=document.createElement("div");

    div.className="message user-message";

    div.innerHTML=
        '<div class="message-name">Você</div>'+
        escapeHTML(texto);

    document.getElementById("chat")
        .appendChild(div);
}

function mostrarIA(texto){

    const div=document.createElement("div");

    div.className="message ai-message";

    const nome=document.createElement("div");

    nome.className="message-name";

    nome.textContent="🤖 ScriptAI";

    div.appendChild(nome);

    const partes=
        texto.split(/```(?:lua|luau)?/i);

    let codigoEncontrado=false;

    for(let i=0;i<partes.length;i++){

        if(i%2===0){

            if(partes[i].trim()){

                const p=
                    document.createElement("div");

                p.textContent=partes[i];

                div.appendChild(p);
            }

        }else{

            codigoEncontrado=true;

            const container=
                document.createElement("div");

            container.className="code-container";

            const topo=
                document.createElement("div");

            topo.className="code-top";

            const linguagem=
                document.createElement("span");

            linguagem.textContent="Lua / Luau";

            const copiar=
                document.createElement("button");

            copiar.className="copy-button";

            copiar.textContent="📋 Copiar";

            copiar.onclick=async function(){

                try{

                    await navigator.clipboard.writeText(
                        partes[i].trim()
                    );

                    copiar.textContent="✅ Copiado!";

                    setTimeout(
                        ()=>{
                            copiar.textContent="📋 Copiar";
                        },
                        1500
                    );

                }catch{

                    copiar.textContent="❌ Erro";

                }
            };

            topo.appendChild(linguagem);
            topo.appendChild(copiar);

            const pre=
                document.createElement("pre");

            pre.textContent=partes[i];

            container.appendChild(topo);
            container.appendChild(pre);

            div.appendChild(container);
        }
    }

    if(!codigoEncontrado && !texto.includes("```")){

        div.innerHTML=
            '<div class="message-name">🤖 ScriptAI</div>'+
            '<div>'+escapeHTML(texto)+'</div>';

    }

    document.getElementById("chat")
        .appendChild(div);
}

/*
========================================================
DETECTOR DE PEDIDO DE SCRIPT
========================================================
*/

function pediuCodigo(texto){

    const t=texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"");

    const pedidos=[

        "cria um script",
        "crie um script",
        "faz um script",
        "faca um script",
        "fazer um script",
        "gere um script",
        "gera um script",
        "gerar um script",
        "quero um script",
        "preciso de um script",
        "me de um script",
        "me da um script",
        "me de o script",
        "me da o script",

        "cria sistema",
        "cria um sistema",
        "crie sistema",
        "crie um sistema",
        "faz sistema",
        "faz um sistema",
        "faca sistema",
        "faca um sistema",
        "fazer sistema",
        "fazer um sistema",
        "gere sistema",
        "gere um sistema",
        "gera sistema",
        "gera um sistema",
        "gerar sistema",
        "gerar um sistema",
        "quero sistema",
        "quero um sistema",
        "preciso de um sistema",
        "me de um sistema",
        "me da um sistema",

        "criar script",
        "criar um script",
        "criar sistema",
        "criar um sistema",

        "codigo para",
        "codigo de",
        "script para",
        "script de",
        "codigo lua",
        "script lua",
        "script luau",
        "codigo luau",

        "adicione um sistema",
        "adiciona um sistema",
        "adicionar um sistema",

        "monte um sistema",
        "monta um sistema",

        "construa um sistema",
        "construir um sistema",

        "desenvolva um sistema",
        "desenvolver um sistema"
    ];

    return pedidos.some(
        frase=>t.includes(frase)
    );
}

/*
========================================================
RESPOSTAS NORMAIS
========================================================
*/

function respostaNormal(texto){

    const t=texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .trim();

    if(
        /^(oi|ola|eai|e ai|opa|hey|hello|hi)[!?. ]*$/.test(t)
    ){

        return "Olá! 👋 Eu sou a ScriptAI. Posso conversar com você e também criar scripts e sistemas para Roblox. Quando quiser código, diga algo como: \"Crie um sistema de dinheiro para Roblox\".";

    }

    if(
        t.includes("quem e voce") ||
        t.includes("quem e vc")
    ){

        return "🤖 Eu sou a ScriptAI, focada em ajudar a criar scripts e sistemas em Lua/Luau para Roblox.";

    }

    if(
        t.includes("o que voce faz") ||
        t.includes("o que vc faz")
    ){

        return "Posso ajudar a planejar e gerar scripts e sistemas para Roblox. Quando quiser que eu gere código, basta pedir explicitamente, por exemplo: \"Crie um sistema de loja com dinheiro e GUI\".";

    }

    if(
        t.includes("obrigado") ||
        t.includes("valeu") ||
        t.includes("vlw")
    ){

        return "Tamo junto! 😎🔥";

    }

    return "Entendi! 👍 Se você quiser que eu gere código, é só pedir explicitamente, por exemplo: \"Crie um script de dinheiro para Roblox\".";

}

/*
========================================================
GERADOR DE PROJETO
========================================================
*/

function gerarProjeto(pedido){

    const p=pedido
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"");

    let partes=[];

    if(
        p.includes("cidade") ||
        p.includes("rp")
    ){

        partes.push({

            nome:
            "ServerScriptService/CityServer.server.lua",

            codigo:
`-- ScriptAI
-- Sistema base de Cidade RP

local Players =
    game:GetService("Players")

local DataStoreService =
    game:GetService("DataStoreService")

local dinheiroStore =
    DataStoreService:GetDataStore(
        "ScriptAI_Dinheiro_V1"
    )

Players.PlayerAdded:Connect(function(player)

    local leaderstats =
        Instance.new("Folder")

    leaderstats.Name =
        "leaderstats"

    leaderstats.Parent =
        player

    local dinheiro =
        Instance.new("IntValue")

    dinheiro.Name =
        "Dinheiro"

    dinheiro.Value =
        500

    dinheiro.Parent =
        leaderstats

    local sucesso,dados =
        pcall(function()

            return dinheiroStore:GetAsync(
                player.UserId
            )

        end)

    if sucesso and dados then

        dinheiro.Value =
            dados

    end

end)

Players.PlayerRemoving:Connect(function(player)

    local stats =
        player:FindFirstChild(
            "leaderstats"
        )

    if not stats then
        return
    end

    local dinheiro =
        stats:FindFirstChild(
            "Dinheiro"
        )

    if not dinheiro then
        return
    end

    pcall(function()

        dinheiroStore:SetAsync(
            player.UserId,
            dinheiro.Value
        )

    end)

end)`
        });
    }

    if(
        p.includes("dinheiro") ||
        p.includes("moeda")
    ){

        partes.push({

            nome:
            "ServerScriptService/MoneySystem.server.lua",

            codigo:
`-- Sistema de dinheiro

local Players =
    game:GetService("Players")

Players.PlayerAdded:Connect(function(player)

    local stats =
        player:FindFirstChild(
            "leaderstats"
        )

    if not stats then

        stats =
            Instance.new("Folder")

        stats.Name =
            "leaderstats"

        stats.Parent =
            player

    end

    local money =
        stats:FindFirstChild(
            "Dinheiro"
        )

    if not money then

        money =
            Instance.new("IntValue")

        money.Name =
            "Dinheiro"

        money.Value =
            500

        money.Parent =
            stats

    end

end)

local function adicionarDinheiro(
    p
