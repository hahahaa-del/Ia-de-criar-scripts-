/* ==============================

============================== */

const STORAGE_KEY =
"SCRIPT_AI_CHATS_V3";

/* ==============================

============================== */

try{

    chats =

            STORAGE_KEY

}catch(error){

/* ==============================

============================== */

);

document.getElementById(

   SALVAR
============================== */

function salvar(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(chats)
    );

}


/* ==============================
   ESCAPAR HTML
============================== */

function escapeHTML(text){

    return String(text).replace(
        /[&<>"']/g,
        function(character){

            const entities={

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            };

            return entities[
                character
            ];

        }
    );

}

/* ==============================
   USUÁRIO
============================== */

function mostrarUsuario(texto){

    const div =
    document.createElement(
        "div"
    );

    div.className =
    "message user-message";

    div.innerHTML =
    `
    <div class="message-name">
        Você

}


/* ==============================
   IA
============================== */

function mostrarIA(texto){

    const div =
    document.createElement(
        "div"
    );

    div.className =
    "message ai-message";

    const nome =
    document.createElement(
        "div"
    );

    nome.className =
    "message-name";

    nome.textContent =
    "🤖 ScriptAI";

    div.appendChild(nome);


    const partes =
    texto.split(
        /```(?:lua|luau)?/i
    );

    for(
        let i=0;
        i<partes.length;
        i++
    ){

        if(i%2===0){

            if(
                partes[i].trim()
            ){

                const textoDiv =
                document.createElement(
                    "div"
                );

                textoDiv.innerHTML =
                escapeHTML(
                    partes[i]
                ).replace(
                    /\n/g,
                    "<br>"
                );

                div.appendChild(
                    textoDiv
                );

            }

        }else{

            const container =
            document.createElement(
                "div"
            );

            container.className =
            "code-container";


            const topo =
            document.createElement(
                "div"
            );

            topo.className =
            "code-top";


            const linguagem =
            document.createElement(
                "span"
            );

            linguagem.textContent =
            "Lua / Luau";


            const copiar =
            document.createElement(
                "button"
            );

            copiar.className =
            "copy-button";

            copiar.textContent =
            "📋 Copiar";


            const codigo =
            partes[i].trim();


            copiar.addEventListener(
                "click",
                async function(){

                    try{

                        await navigator
                        .clipboard
                        .writeText(
                            codigo
                        );

                        copiar.textContent =
                        "✅ Copiado!";

                        setTimeout(
                            function(){

                                copiar.textContent =
                                "📋 Copiar";

                            },
                            1500
                        );

                    }catch(error){

                        copiar.textContent =
                        "❌ Erro";

                    }

                }
            );


            topo.appendChild(
                linguagem
            );

            topo.appendChild(
                copiar
            );


            const pre =
            document.createElement(
                "pre"
            );

            pre.textContent =
            codigo;


            container.appendChild(
                topo
            );

            container.appendChild(
                pre
            );

            div.appendChild(
                container
            );

        }

    }

    chat.appendChild(div);

}


/* ==============================
   DETECTAR PEDIDO DE CÓDIGO
============================== */

function pediuCodigo(texto){

    const t =
    texto
    .toLowerCase()
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    );


    const frases=[

        "cria um script",
        "crie um script",
        "faz um script",
        "faca um script",
        "fazer um script",

        "gera um script",
        "gere um script",
        "gerar um script",

        "quero um script",
        "preciso de um script",

        "me de um script",
        "me da um script",

        "cria um sistema",
        "crie um sistema",

        "faz um sistema",
        "faca um sistema",

        "fazer um sistema",

        "gera um sistema",
        "gere um sistema",
        "gerar um sistema",

        "quero um sistema",
        "preciso de um sistema",

        "criar um sistema",
        "criar sistema",

        "criar um script",
        "criar script",

        "codigo para",
        "codigo de",

        "script para",
        "script de",

        "codigo lua",
        "script lua",

        "codigo luau",
        "script luau",

        "adicione um sistema",
        "adiciona um sistema",

        "monte um sistema",
        "monta um sistema",

        "construa um sistema",
        "construir um sistema"

    ];


    return frases.some(
        function(frase){

            return t.includes(
                frase
            );

        }
    );

}


/* ==============================
   RESPOSTA NORMAL
============================== */

function respostaNormal(texto){

    const t =
    texto
    .toLowerCase()
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    )
    .trim();


    if(
        /^(oi|ola|eai|e ai|opa|hey|hello|hi)[!?. ]*$/
        .test(t)
    ){

        return `
Olá! 👋

Eu sou a ScriptAI.

Posso conversar com você e criar
scripts e sistemas para Roblox.

Quando quiser código, diga por exemplo:

"Crie um script de sistema de dinheiro para Roblox."
`;

    }


    if(
        t.includes("quem e voce") ||
        t.includes("quem e vc")
    ){

        return `
🤖 Sou a ScriptAI!

Fui criada para ajudar a desenvolver
scripts e sistemas para Roblox em Lua/Luau.
`;

    }


    if(
        t.includes("o que voce faz") ||
        t.includes("o que vc faz")
    ){

        return `
Posso ajudar a criar scripts e sistemas
para Roblox.

Exemplo:

"Crie um sistema de loja com dinheiro e GUI."
`;

    }


    if(
        t.includes("obrigado") ||
        t.includes("valeu") ||
        t==="vlw"
    ){

        return "Tamo junto! 😎🔥";

    }


    return `
Entendi! 👍

Se você quiser que eu gere código,
peça explicitamente.

Exemplo:

"Crie um script de dinheiro para Roblox."
`;

}
