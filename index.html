<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScriptAI</title>

<style>
body{
    margin:0;
    background:#080b12;
    color:white;
    font-family:Arial,sans-serif;
    padding:30px;
}

.container{
    max-width:800px;
    margin:auto;
}

h1{
    text-align:center;
}

textarea{
    width:100%;
    height:120px;
    background:#151a23;
    color:white;
    border:1px solid #444;
    border-radius:10px;
    padding:15px;
    box-sizing:border-box;
    resize:none;
}

button{
    margin-top:10px;
    padding:14px 25px;
    border:0;
    border-radius:10px;
    background:#825cff;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#7048ed;
}

#resposta{
    margin-top:20px;
    padding:20px;
    background:#11161f;
    border-radius:10px;
    white-space:pre-wrap;
}

pre{
    background:#05070a;
    padding:15px;
    border-radius:8px;
    overflow:auto;
}
</style>
</head>

<body>

<div class="container">

<h1>🤖 ScriptAI</h1>

<p>Digite o que você quer que eu crie:</p>

<textarea
id="pedido"
placeholder="Ex: Crie um sistema de dinheiro para Roblox"
></textarea>

<br>

<button
type="button"
onclick="GERAR_SCRIPT()"
>
GERAR
</button>

<div id="resposta">
Aguardando seu pedido...
</div>

</div>


<script>

function GERAR_SCRIPT(){

    var pedido =
        document.getElementById("pedido").value;

    var resposta =
        document.getElementById("resposta");


    if(pedido.trim() === ""){

        resposta.innerText =
            "⚠️ Digite um pedido primeiro.";

        return;

    }


    var texto =
        pedido.toLowerCase();


    /* DINHEIRO */

    if(
        texto.includes("dinheiro") ||
        texto.includes("moeda")
    ){

        resposta.innerHTML =
        "<b>🤖 ScriptAI</b><br><br>" +

        "Aqui está seu sistema de dinheiro:" +

        "<pre>" +

`local Players = game:GetService("Players")

Players.PlayerAdded:Connect(function(player)

    local leaderstats =
        Instance.new("Folder")

    leaderstats.Name =
        "leaderstats"

    leaderstats.Parent =
        player


    local dinheiro =
        Instance.new("IntValue")

    dinheiro.Name =
        "Dinheiro"

    dinheiro.Value =
        500

    dinheiro.Parent =
        leaderstats

end)` +

        "</pre>" +

        "📌 Coloque o Script em ServerScriptService.";

        return;

    }


    /* LOJA */

    if(texto.includes("loja")){

        resposta.innerHTML =
        "<b>🤖 ScriptAI</b><br><br>" +

        "Sistema de loja:" +

        "<pre>" +

`local function Comprar(player, preco)

    local stats =
        player:FindFirstChild("leaderstats")

    if not stats then return end

    local dinheiro =
        stats:FindFirstChild("Dinheiro")

    if not dinheiro then return end

    if dinheiro.Value >= preco then

        dinheiro.Value -= preco

        print("Compra realizada!")

    end

end` +

        "</pre>";

        return;

    }


    /* NPC */

    if(texto.includes("npc")){

        resposta.innerHTML =
        "<b>🤖 ScriptAI</b><br><br>" +

        "Sistema de NPC:" +

        "<pre>" +

`local PathfindingService =
    game:GetService("PathfindingService")

local function NPCAndar(npc, destino)

    local humanoid =
        npc:FindFirstChildOfClass("Humanoid")

    local root =
        npc:FindFirstChild("HumanoidRootPart")

    if not humanoid or not root then
        return
    end

    local path =
        PathfindingService:CreatePath()

    path:ComputeAsync(
        root.Position,
        destino
    )

    if path.Status ==
        Enum.PathStatus.Success then

        for _, waypoint in
        ipairs(path:GetWaypoints()) do

            humanoid:MoveTo(
                waypoint.Position
            )

            humanoid.MoveToFinished:Wait()

        end

    end

end` +

        "</pre>";

        return;

    }


    /* CARRO */

    if(
        texto.includes("carro") ||
        texto.includes("veículo") ||
        texto.includes("veiculo")
    ){

        resposta.innerHTML =
        "<b>🤖 ScriptAI</b><br><br>" +

        "Sistema de carros:" +

        "<pre>" +

`local function SpawnCar(
    player,
    modelo
)

    if not modelo then
        return
    end

    local carro =
        modelo:Clone()

    carro.Parent =
        workspace

    if player.Character then

        carro:PivotTo(
            player.Character:GetPivot()
            *
            CFrame.new(0,0,-10)
        )

    end

end` +

        "</pre>";

        return;

    }


    /* POLÍCIA */

    if(
        texto.includes("policia") ||
        texto.includes("polícia") ||
        texto.includes("prisao") ||
        texto.includes("prisão")
    ){

        resposta.innerHTML =
        "<b>🤖 ScriptAI</b><br><br>" +

        "Sistema de procurado/prisão:" +

        "<pre>" +

`function Procurar(player, nivel)

    player:SetAttribute(
        "Procurado",
        nivel or 1
    )

end


function Prender(player, tempo)

    player:SetAttribute(
        "Preso",
        true
    )

    task.delay(
        tempo or 15,
        function()

            if player then

                player:SetAttribute(
                    "Preso",
                    false
                )

            end

        end
    )

end` +

        "</pre>";

        return;

    }


    /* QUALQUER OUTRO PEDIDO */

    resposta.innerHTML =
    "<b>🤖 ScriptAI</b><br><br>" +

    "Entendi seu pedido:<br><br>" +

    "<b>" +
    pedido.replace(
        /</g,
        "&lt;"
    ) +
    "</b><br><br>" +

    "Para sistemas programados, tente pedir algo como:<br>" +

    "• Crie um sistema de dinheiro para Roblox<br>" +
    "• Crie um sistema de loja para Roblox<br>" +
    "• Crie um sistema de NPC para Roblox<br>" +
    "• Crie um sistema de carros para Roblox<br>" +
    "• Crie um sistema de polícia para Roblox";

}

</script>

</body>
</html>
